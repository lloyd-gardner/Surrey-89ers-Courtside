<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>89ers Courtside</title>
<meta name="theme-color" content="#0E1512">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Courtside">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
</style>
</head>
<body>

<style>
:root{
  color-scheme: dark;
  --ground:#0E1512; --surface:#141C18; --raised:#1B2621; --line:#2B3A33; --line-soft:#1F2A25;
  --ink:#EEF3EF; --muted:#A3B4AA; --faint:#7F9187;
  --accent:#2FBF71; --accent-ink:#06120B; --accent-soft:#18251E; --accent-line:#2F6B4A;
  --amber:#F2A23A; --amber-ink:#1A0F02;
  --display:'Avenir Next Condensed','Barlow Condensed','Arial Narrow',sans-serif;
  --body:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
}
html,body{background:var(--ground);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.35;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{padding:12px 16px 20px;max-width:1400px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
.h{font-family:var(--display);font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin:0}
.lbl{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:18px;padding:12px 14px}
.stack{display:grid;grid-gap:10px;gap:10px;align-content:start}
.row{display:flex;align-items:center}
.row>*+*{margin-left:8px}
.spread{display:flex;align-items:center;justify-content:space-between}

.btn{min-height:44px;border:1px solid var(--line);background:var(--raised);color:var(--ink);border-radius:12px;font-weight:600;font-size:15px;padding:0 12px;line-height:1.15}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.warn{background:#3A1E14;border-color:#8A3B22;color:#FFD9CC}
.btn[disabled]{background:#222C27;border-color:#26332D;color:var(--faint);cursor:default}
.btn.big{min-height:54px;font-size:18px;border-radius:14px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-gap:8px;gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-gap:6px;gap:6px}
.g5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-gap:6px;gap:6px}
.g5 .btn{padding:0 2px;font-size:13px}
.g6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-gap:6px;gap:6px}
.g12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-gap:6px;gap:6px}
.s3{grid-column:span 3}.s4{grid-column:span 4}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;flex-shrink:0;vertical-align:middle}

/* top bar */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;grid-gap:12px;gap:12px;padding-bottom:10px}
.crest{width:42px;height:42px;border-radius:50%;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:19px;flex-shrink:0}
.score{text-align:center}
.score .big{font-family:var(--display);font-weight:700;font-size:38px;line-height:1}
.tabs{display:inline-grid;grid-auto-flow:column;grid-gap:4px;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.tab{min-height:44px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--ink);font-weight:600;font-size:15px;white-space:nowrap}
.tab.on{background:var(--accent);color:var(--accent-ink)}
.qbar{display:flex;align-items:center;flex-wrap:wrap;padding:0 0 6px}
.qbar>*{margin:0 8px 6px 0}
.seg{display:inline-grid;grid-auto-flow:column;grid-gap:3px;gap:3px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.seg button{min-height:40px;min-width:46px;padding:0 10px;border:0;border-radius:9px;background:transparent;color:var(--ink);font-weight:600;font-size:14px}
.seg button.on{background:var(--ink);color:var(--ground)}
.status{font-size:13px;color:var(--muted);display:inline-flex;align-items:center}
.status .dot{border-radius:50%;margin-right:6px}

/* log */
.log-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,1fr);grid-gap:12px;gap:12px;align-items:start}
.src{min-height:56px;text-align:left;padding:8px 11px;display:flex;flex-direction:column;justify-content:space-between}
.src .nm{font-size:15px;display:flex;align-items:center}
.src .nm .dot{margin-right:8px}
.src .sub{font-size:12px;font-weight:500;display:flex;justify-content:space-between;color:var(--muted)}
.src.on .sub{color:#0B2A18}
.src .early{letter-spacing:.08em;font-weight:700}
.jersey{min-height:44px;font-family:var(--display);font-size:20px;font-weight:700;padding:0}
.roles{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);grid-gap:6px;gap:6px}
.role{min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px}
.role .who{font-family:var(--display);font-size:20px;font-weight:700;line-height:1}
.role .rl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.role.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.empty{border:1px dashed #33443B;border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
.recent{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 96px;grid-gap:10px;gap:10px;margin-top:10px}
.rc{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:9px 12px;min-width:0}
.rc .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .d{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edit-banner{background:#2A2413;border:1px solid #6B5320;color:#FBE6BD;border-radius:12px;padding:8px 12px;margin-bottom:10px}
.sample-banner{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:12px;font-weight:600;max-width:90%;z-index:10}

/* game day (quick log: source, finish, result) */
.gd-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.1fr);grid-gap:12px;gap:12px;align-items:start}
.gd-src{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-gap:8px;gap:8px}
.gd-src .src{min-height:76px;padding:10px 12px}
.gd-src .src .nm{font-size:17px}
.gd-fin{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-gap:8px;gap:8px}
.gd-fin .btn{min-height:56px;font-size:16px}
.gd-cov{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-gap:8px;gap:8px}
.gd-cov .btn{min-height:50px;font-size:16px}
.gd-res{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-gap:8px;gap:8px}
.gd-res .btn{min-height:60px;font-family:var(--display);font-size:24px;font-weight:700;padding:0 4px}
.gd-res .btn.ft{min-height:52px;font-size:19px}
.gd-res .btn.stop{grid-column:span 2;min-height:64px;background:var(--accent-soft);border-color:var(--accent-line);color:#9BE3BC}
.gd-res .btn[disabled]{background:#222C27;border-color:#26332D;color:var(--faint)}
.gd-pick{font-size:14px;color:var(--muted);min-height:20px}
.gd-pick b{color:var(--ink)}
.tag.todo{background:#2A2413;color:#F2C46A;border-color:#6B5320}

/* summary drill-down */
.sx{display:inline-flex;align-items:center;min-height:40px;border:0;background:none;padding:0;font-weight:600;font-size:14px;color:var(--ink)}
.sx .chev{display:inline-block;width:16px;color:var(--muted);font-size:18px;transition:transform .15s}
.sx-row.open .chev{transform:rotate(90deg)}
.sx-row.open td{border-bottom-color:transparent}
.sx-sub td{background:var(--raised);font-size:13px;padding-top:5px;padding-bottom:5px}
.sx-sub .fin-nm{padding-left:24px}
.bar.thin{height:7px}
.jersey .pn{display:block;font-family:var(--body);font-size:10px;font-weight:600;letter-spacing:0;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px;opacity:.8}

/* season */
.seg-mode button{min-width:92px}
.sum-grid .card,.sum-grid .stack{min-width:0}
.sum-grid.season{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.sum-grid.season .tbl th,.sum-grid.season .tbl td{padding-left:6px;padding-right:6px}
.spark{display:flex;align-items:flex-end;height:30px;min-width:96px}
.spark i{flex:1;max-width:14px;margin-right:4px;border-radius:3px 3px 0 0;display:block}
.spark i.nil{height:4px;background:var(--line);border-radius:2px}
.tr-row.sel td,.gl-row.sel td{background:var(--raised)}
.fc-chips{display:flex;flex-wrap:wrap;margin:-3px}
.fc-chips .btn{margin:3px;min-height:38px;font-size:14px;border-radius:999px;padding:0 13px}
.fc-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-gap:10px;gap:10px}
.fc-stats>div{background:var(--raised);border-radius:12px;padding:10px 12px;display:grid;grid-gap:3px;gap:3px;justify-items:start}
.fc-big{font-family:var(--display);font-weight:700;font-size:32px;line-height:1}
.fc-chart{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);grid-gap:10px;gap:10px;padding-top:4px}
.fc-col{display:grid;grid-template-rows:auto 120px auto;justify-items:center;min-width:0}
.fc-val{font-weight:700;font-size:14px;margin-bottom:4px}
.fc-plot{width:100%;display:flex;align-items:flex-end;justify-content:center;border-bottom:1px solid var(--line)}
.fc-plot i{display:block;width:60%;max-width:46px;border-radius:4px 4px 0 0}
.fc-lbl{display:grid;justify-items:center;font-size:12px;margin-top:5px;text-align:center;max-width:100%}
.fc-lbl b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.fc-lbl span{color:var(--muted)}
.fc-plot{position:relative}
.fc-plot u{position:absolute;left:-5px;right:-5px;border-top:2px dashed var(--muted);z-index:1;pointer-events:none}

/* list + tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.bar{height:10px;background:var(--raised);border-radius:5px;position:relative;min-width:60px}
.bar span{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-gap:12px;gap:12px}
.kpi .v{font-family:var(--display);font-weight:700;font-size:44px;line-height:1}
.sum-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);grid-gap:12px;gap:12px;margin-top:12px;align-items:start}

/* home */
.home-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);grid-gap:14px;gap:14px;align-items:start}
.field{display:grid;grid-gap:6px;gap:6px}
.field input[type=text],.field input[type=date]{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--raised);padding:0 12px;font-size:16px;width:100%}
.gitem{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-gap:10px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.gitem:last-child{border-bottom:0}
.gbtns{display:grid;grid-auto-flow:column;grid-gap:6px;gap:6px}
.hint{font-size:13px;color:var(--muted);line-height:1.45}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;padding:2px 6px;border-radius:6px;background:var(--accent-soft);color:#9BE3BC;border:1px solid var(--accent-line);vertical-align:middle}

/* live (LiveStats feed, targets, four factors, their calls) */
.lv-top{display:flex;align-items:center;flex-wrap:wrap;padding:8px 12px;margin-bottom:10px}
.lv-top>*{margin:4px 14px 4px 0}
.lv-pill{display:inline-flex;align-items:center;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:var(--raised);color:var(--muted);white-space:nowrap}
.lv-pill .dot{width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:7px}
.lv-pill.live{background:var(--accent-soft);color:var(--accent)}
.lv-pill.live .dot{animation:lvpulse 1.6s ease-in-out infinite}
.lv-pill.warn,.lv-badge.warn{background:#2A2413;color:#F2C46A}
.lv-pill.bad,.lv-badge.bad{background:#3A1E14;color:#FFB4A0}
@keyframes lvpulse{50%{opacity:.3}}
.lv-board{font-size:15px;white-space:nowrap}
.lv-board b{font-family:var(--display);font-size:28px;font-weight:700}
.lv-board b.us,.lv-us{color:var(--accent)}
.lv-clk{margin-left:12px;padding-left:12px;border-left:1px solid var(--line);font-weight:700;font-size:20px}
.lv-grid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(290px,1fr);grid-gap:12px;gap:12px;align-items:start}
.lv-col{display:grid;grid-gap:10px;gap:10px;align-content:start;min-width:0}
.lv-sec{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;margin:4px 2px -2px}
.lv-g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-gap:10px;gap:10px}
.lv-g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-gap:10px;gap:10px}
.lv-tgt,.lv-met{display:grid;grid-gap:7px;gap:7px;align-content:start;min-width:0}
.lv-side{display:grid;grid-gap:5px;gap:5px}
.lv-who{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.04em}
.lv-side.us .lv-who{color:var(--accent)}
.lv-big{font-family:var(--display);font-weight:700;font-size:38px;line-height:1}
.lv-side.them .lv-big{font-size:28px}
.lv-track{position:relative;height:8px;border-radius:4px;background:var(--raised)}
.lv-track span{position:absolute;top:0;bottom:0;left:0;border-radius:4px}
.lv-side.us .lv-track .act,.lv-side.us .lv-track .proj{background:var(--accent)}
.lv-side.them .lv-track .act,.lv-side.them .lv-track .proj{background:var(--muted)}
.lv-track .proj{opacity:.3}
.lv-track .tick{width:2px;margin-left:-1px;top:-4px;bottom:-4px;background:var(--ink);border-radius:1px}
.lv-hr{height:1px;background:var(--line-soft)}
.lv-badge{font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 7px;border-radius:7px;background:var(--raised);color:var(--muted);white-space:nowrap}
.lv-badge.good{background:var(--accent-soft);color:#9BE3BC}
.lv-val{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05}
.lv-mbar{height:6px;border-radius:3px;background:var(--raised);overflow:hidden}
.lv-mbar i{display:block;height:100%;border-radius:3px;background:var(--faint)}
.lv-mbar i.good{background:var(--accent)}
.lv-mbar i.bad{background:#E2603F}
.tbl th.lv-now,.tbl td.lv-now{background:var(--raised)}
.lv-g5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-gap:10px;gap:10px}
.card.lv-met{padding:10px 12px;grid-gap:5px;gap:5px}
.lv-foot{font-size:12px;color:var(--muted);line-height:1.4}
.lv-foot b{color:var(--ink)}
.lv-delta{display:inline-block;font-weight:700;font-size:12px;padding:1px 5px;border-radius:5px;background:var(--raised);color:var(--muted);white-space:nowrap}
.lv-delta.good{background:var(--accent-soft);color:#9BE3BC}
.lv-delta.bad{background:#3A1E14;color:#FFB4A0}
.lv-stamprow{display:flex;flex-wrap:wrap;align-items:center}
.lv-stamprow>*{margin:0 10px 6px 0}
.lv-in.lv-clockin{width:124px;min-height:50px;font-family:var(--display);font-size:28px;font-weight:700;text-align:center;padding:0 8px}
.btn.lv-callbtn{width:100%;min-height:68px;background:var(--ink);border-color:var(--ink);color:var(--ground);font-family:var(--display);font-size:28px;letter-spacing:.1em;display:flex;align-items:center;justify-content:center}
.btn.lv-callbtn span+span{margin-left:16px;font-family:var(--body);font-size:16px;letter-spacing:0;opacity:.75}
.lv-comp{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:12px}
.lv-stampbig{font-family:var(--display);font-weight:700;font-size:28px;min-width:112px}
.lv-comp .row{flex-wrap:wrap}
.lv-comp .row .btn{min-width:46px;padding:0 8px;margin-bottom:6px}
.lv-chips{display:flex;flex-wrap:wrap;margin:-3px}
.lv-chips .btn{margin:3px;min-height:40px;font-size:14px;border-radius:999px;padding:0 13px}
.lv-in{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--ground);padding:0 12px;font-size:16px;width:100%}
.lv-in.small{width:72px;text-align:center;margin-right:10px}
.lv-row{display:grid;grid-template-columns:62px minmax(0,1fr) auto;grid-gap:10px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.lv-row:last-child{border-bottom:0}
.lv-row.ro{grid-template-columns:62px minmax(0,1fr)}
/* game day playcall strip */
.pc-strip{display:grid;grid-template-columns:minmax(250px,320px) minmax(0,1fr);grid-gap:12px;gap:12px;align-items:center;padding:8px;margin-bottom:12px}
.pc-strip .btn.lv-callbtn{min-height:60px;font-size:26px}
.pc-recent{display:flex;align-items:center;flex-wrap:wrap;min-width:0;margin:-3px}
.pc-recent>*{margin:3px}
.pc-chip{display:inline-flex;align-items:center;min-height:44px;max-width:240px;border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:0 14px;font-size:14px;color:var(--ink)}
.pc-chip .num{color:var(--muted);margin-right:8px;white-space:nowrap}
.pc-chip b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-chip.on{background:var(--accent-soft);border-color:var(--accent)}
.pc-comp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);grid-gap:14px;gap:14px;margin:-4px 0 12px}
.lv-link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;font-size:13px}

@media (max-width: 900px){
  .log-grid,.sum-grid,.sum-grid.season,.home-grid,.lv-grid,.lv-g3,.gd-grid,.pc-strip,.pc-comp{grid-template-columns:minmax(0,1fr)}
  .recent{grid-template-columns:minmax(0,1fr) 96px}
  .recent .rc:nth-child(n+2){display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .top{grid-template-columns:minmax(0,1fr) auto}
  .top .score{display:none}
}
@media (max-width: 600px){
  .lv-g5{grid-template-columns:repeat(3,minmax(0,1fr))}
  .lv-g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width: 520px){
  .tab{padding:0 10px;font-size:14px}
  .kpi .v{font-size:34px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}.lv-pill.live .dot{animation:none}}
</style>

<div id="app" aria-live="polite"></div>
<div id="toast" class="toast" hidden></div>

<script>
(function () {
  'use strict';

  /* ---------- Config: edit these lists to change the buttons ---------- */
  var OTHER = '#9085e9';
  var SOURCES = [
    { id: 'Transition', color: '#3987e5', early: true, finishes: ['One on One', 'Run Out', 'Turnover', 'Post Up', 'Spot Up', 'Drive and Kick'] },
    { id: 'PNR', color: '#d95926', screen: true, cov: true, finishes: ['Drive and Kick', 'Drive and Dump', 'Roll Finish', '2pt Jumper', '3pt Jumper', 'Pass Out', 'Pick and Pop', 'Drive', 'Spain', 'Reject'] },
    { id: '1-on-1', color: '#199e70', finishes: ['Drive and Dump', 'Drive and Kick', 'Drive Finish', 'Pull Up'] },
    { id: 'Post up', color: '#c98500', finishes: ['Middle hook', 'Baseline turn', 'Face-up J', 'Kick out', 'Cutter'] },
    { id: 'Off. rebound', color: '#d55181', early: true, finishes: ['Put back', 'Kick out', 'Reset'] },
    { id: 'Cut', color: OTHER, finishes: ['Baseline', '45 cut', 'Backdoor'] },
    { id: 'Off-ball screen', color: OTHER, screen: true, finishes: ['Curl', 'Flare', 'Straight', 'Slip'] },
    { id: 'Handoff', color: OTHER, screen: true, cov: true, finishes: ['Keep', 'Pull-up', 'Pass'] },
    { id: 'Spot up', color: OTHER, finishes: ['Catch & shoot', 'Closeout drive'] },
    { id: 'Out of bounds', color: OTHER, finishes: ['SLOB', 'BLOB', 'ATO'] },
    { id: 'Zone', color: OTHER, finishes: ['Short corner', 'Skip', 'High post'] },
    { id: 'Other', color: OTHER, finishes: ['Foul', 'Loose ball', 'Other'] }
  ];
  var WHERE = ['L side', 'L slot', 'Middle', 'R slot', 'R side'];
  var COVS = ['Drop', 'Flat', 'Switch', 'Ice', 'Blitz', 'Late'];
  var RESULTS = [
    { id: '2', label: '2 pts', pts: 2, span: 's3' },
    { id: '3', label: '3 pts', pts: 3, span: 's3' },
    { id: '2+1', label: '2 + 1', pts: 3, span: 's3' },
    { id: '3+1', label: '3 + 1', pts: 4, span: 's3' },
    { id: 'FTs', label: 'FTs', pts: null, span: 's4' },
    { id: 'Miss', label: 'Miss', pts: 0, span: 's4' },
    { id: 'TO', label: 'Turnover', pts: 0, span: 's4' }
  ];
  var QUARTERS = ['Q1', 'Q2', 'Q3', 'Q4', 'OT'];
  // Game day results: one tap logs the possession. FTs carry the number made after the colon.
  var QUICK_RESULTS = [
    { v: '2', label: '2' }, { v: '3', label: '3' }, { v: '2+1', label: '2+1' }, { v: '3+1', label: '3+1' },
    { v: 'FTs:0', label: '0 FT', ft: true }, { v: 'FTs:1', label: '1 FT', ft: true }, { v: 'FTs:2', label: '2 FT', ft: true }, { v: 'FTs:3', label: '3 FT', ft: true },
    { v: 'Miss', label: 'Miss', stop: true }, { v: 'TO', label: 'Turnover', stop: true }
  ];

  /* ---------- Storage (this device only; works with no internet) ---------- */
  var PREFIX = 'cs89.';
  var storageOK = true;
  function sget(k) {
    try { var v = window.localStorage.getItem(PREFIX + k); return v ? JSON.parse(v) : null; }
    catch (e) { storageOK = false; return null; }
  }
  function sset(k, v) {
    try { window.localStorage.setItem(PREFIX + k, JSON.stringify(v)); return true; }
    catch (e) { storageOK = false; return false; }
  }
  function sdel(k) { try { window.localStorage.removeItem(PREFIX + k); } catch (e) {} }
  (function probe() {
    try { window.localStorage.setItem(PREFIX + 'probe', '1'); window.localStorage.removeItem(PREFIX + 'probe'); }
    catch (e) { storageOK = false; }
  })();

  var games = {};
  var order = [];

  function persistIndex() { sset('index', order); }
  function saveGame(g) {
    g.updated = Date.now();
    games[g.id] = g;
    if (order.indexOf(g.id) < 0) order.unshift(g.id);
    sset('game.' + g.id, g);
    persistIndex();
  }
  function deleteGame(id) {
    if (id === 'sample') sset('sampleDismissed', true);
    delete games[id];
    var i = order.indexOf(id);
    if (i >= 0) order.splice(i, 1);
    sdel('game.' + id);
    persistIndex();
  }
  function loadAll() {
    var ids = sget('index') || [];
    for (var i = 0; i < ids.length; i++) {
      var g = sget('game.' + ids[i]);
      if (g && g.id) { if (renameFinishes(g)) sset('game.' + g.id, g); games[g.id] = g; order.push(g.id); }
    }
  }
  // Finish names that have since been renamed. Games saved with the old names are updated when the app opens.
  var FINISH_RENAMES = {
    PNR: { 'Roll man': 'Roll Finish', 'Pull-up': 'Jumper', 'Cutter': 'Pass Out', 'Pass out': 'Pass Out', 'Pop': 'Pick and Pop', 'Drive middle': 'Drive', 'Drive baseline': 'Drive' },
    Transition: { 'Run-out': 'Run Out', 'Off our TO': 'Turnover', 'Early 1-on-1': 'One on One', 'Spot up': 'Spot Up' },
    '1-on-1': { 'Pull-up': 'Pull Up' }
  };
  function renameFinishes(g) {
    var changed = false;
    for (var i = 0; i < (g.poss || []).length; i++) {
      var p = g.poss[i], map = FINISH_RENAMES[p.src];
      if (map && p.fin && map[p.fin]) { p.fin = map[p.fin]; changed = true; }
      // PNR Jumper is now split by shot value. Made shots go by the points scored; anything else is
      // set to 2pt Jumper and flagged Needs detail so it can be checked on video.
      if (p.src === 'PNR' && p.fin === 'Jumper') {
        if (p.res === '3' || p.res === '3+1') p.fin = '3pt Jumper';
        else { p.fin = '2pt Jumper'; if (p.res !== '2' && p.res !== '2+1') p.quick = true; }
        changed = true;
      }
      if (p.cov === 'Hedge') { p.cov = 'Flat'; changed = true; }
    }
    return changed;
  }

  /* ---------- Helpers ---------- */
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function todayISO() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function hms(t) { var d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
  function niceDate(iso) {
    if (!iso) return '';
    var p = iso.split('-');
    var m = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][Number(p[1]) - 1] || '';
    return Number(p[2]) + ' ' + m + ' ' + p[0];
  }
  function srcDef(id) { for (var i = 0; i < SOURCES.length; i++) if (SOURCES[i].id === id) return SOURCES[i]; return null; }
  function resDef(id) { for (var i = 0; i < RESULTS.length; i++) if (RESULTS[i].id === id) return RESULTS[i]; return null; }
  function ptsFor(res, ft) { var r = resDef(res); if (!r) return 0; return r.pts === null ? (ft || 0) : r.pts; }
  function resText(p) {
    if (p.res === 'FTs') return 'FTs ' + (p.ft || 0) + ' made';
    if (p.res === 'Miss') return 'Miss';
    if (p.res === 'TO') return 'Turnover';
    return p.pts + ' pts' + (p.res.indexOf('+1') > 0 ? ' (and-1)' : '');
  }
  function parseRoster(s) {
    var parts = String(s || '').split(/[\s,;\/]+/), out = [];
    for (var i = 0; i < parts.length; i++) {
      var n = parts[i].replace(/[^0-9]/g, '');
      if (n.length && n.length <= 2 && out.indexOf(n) < 0) out.push(n);
    }
    out.sort(function (a, b) { return Number(a) - Number(b) || a.length - b.length; });
    return out;
  }
  function gamePts(g) { var t = 0; for (var i = 0; i < g.poss.length; i++) t += g.poss[i].pts; return t; }
  function blankForm() {
    return { src: null, fin: null, where: null, cov: null, res: null, ft: null, creator: null, screener: null, scorer: null, echoes: [] };
  }

  /* ---------- Sample game (so the app opens in a working state) ---------- */
  function makeSample() {
    var d = new Date(); d.setHours(19, 30, 0, 0);
    var base = d.getTime();
    var rows = [
      [1, 'PNR', 'Roll Finish', 'Middle', 'Drop', '2', null, '3', '11', '11', [5]],
      [1, '1-on-1', 'Drive Finish', 'L side', null, '2', null, '3', null, '3', [3]],
      [1, 'Transition', 'Run Out', null, null, '2', null, '7', null, '7', []],
      [1, 'PNR', '3pt Jumper', 'Middle', 'Switch', 'Miss', null, '3', '11', '3', []],
      [1, 'Post up', 'Middle hook', null, null, '2', null, '23', null, '23', [4]],
      [1, 'PNR', 'Drive and Kick', 'R slot', 'Drop', '3', null, '3', '11', '14', [2]],
      [1, 'Off. rebound', 'Put back', null, null, '2', null, '11', null, '11', [1]],
      [1, 'Transition', 'One on One', null, null, '2', null, '7', null, '7', []],
      [1, '1-on-1', 'Drive and Kick', null, null, 'FTs', 2, '14', null, '14', [3]],
      [1, 'Out of bounds', 'SLOB', null, null, '2', null, null, null, '21', []],
      [1, '1-on-1', 'Pull Up', null, null, 'Miss', null, '14', null, '14', []],
      [2, 'PNR', 'Drive', 'Middle', 'Drop', '2', null, '3', '11', '3', [5]],
      [2, 'Post up', 'Baseline turn', null, null, '2', null, '23', null, '23', [4]],
      [2, 'Off. rebound', 'Put back', null, null, '2', null, '11', null, '11', [1]],
      [2, 'Transition', 'Turnover', null, null, '2+1', null, '7', null, '7', [2]],
      [2, 'Transition', 'Run Out', null, null, '2', null, '7', null, '7', []],
      [2, 'Transition', 'Turnover', null, null, '2+1', null, '5', null, '5', [2]],
      [2, 'PNR', 'Roll Finish', 'Middle', 'Drop', '2', null, '3', '11', '11', [5]],
      [2, 'Spot up', 'Catch & shoot', null, null, 'Miss', null, null, null, '32', []],
      [2, '1-on-1', 'Pull Up', null, null, '2', null, '3', null, '3', []],
      [2, 'Off. rebound', 'Kick out', null, null, '3', null, '11', null, '7', [1]],
      [2, 'PNR', '2pt Jumper', 'L side', 'Ice', 'TO', null, '3', '11', null, []],
      [2, 'PNR', '2pt Jumper', 'Middle', 'Drop', '2', null, '3', '11', '3', [5]]
    ];
    var g = { id: 'sample', sample: true, opp: 'Example opponent', date: todayISO(), venue: 'Home',
      roster: ['0', '3', '5', '7', '11', '14', '21', '23', '32'], curQ: 'Q2', marks: { Q1: base, Q2: base + 14 * 60000 }, poss: [], created: Date.now() };
    var qCount = { 1: 0, 2: 0 };
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i], s = srcDef(r[1]);
      qCount[r[0]]++;
      var t = (r[0] === 1 ? base : base + 14 * 60000) + qCount[r[0]] * 48000;
      g.poss.push({ id: 's' + i, n: i + 1, q: 'Q' + r[0], t: t, src: r[1], fin: r[2], where: r[3], cov: s.cov ? r[4] : null,
        res: r[5], ft: r[6], pts: ptsFor(r[5], r[6]), creator: r[7], screener: s.screen ? r[8] : null, scorer: r[9],
        echoes: r[10].map(String), early: !!s.early });
    }
    return g;
  }

  /* ---------- App state ---------- */
  var S = {
    view: 'home', gameId: null, tab: 'quick', sumQ: 'All', sumMode: 'game', trendSrc: 'PNR',
    f: blankForm(), role: 'creator', editId: null,
    q: { src: null, fin: null, cov: null }, listFilter: 'all', sumOpen: {},
    confirm: null, newGame: { opp: '', date: todayISO(), venue: 'Home', roster: '', ls: '' },
    lvLink: '', lvTEdit: false,
    rosterEdit: false, rosterDraft: ''
  };
  var confirmTimer = null, toastTimer = null;

  function G() { return games[S.gameId]; }
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, 2200);
  }
  function armConfirm(key) {
    S.confirm = key;
    clearTimeout(confirmTimer);
    confirmTimer = setTimeout(function () { S.confirm = null; render(); }, 3500);
  }

  /* ---------- Rendering ---------- */
  var app = document.getElementById('app');

  function statusHTML() {
    return storageOK
      ? '<span class="status"><span class="dot" style="background:var(--accent)"></span>Saved on this iPad</span>'
      : '<span class="status"><span class="dot" style="background:var(--amber)"></span>Not saving: storage is blocked here</span>';
  }

  function render() {
    if (!(S.view === 'game' && G())) S.view = 'home';
    if (LV.draft) lvKeepClock();
    lvSync();
    if (S.view === 'game') renderGame(); else renderHome();
  }

  function renderHome() {
    var ng = S.newGame, list = '';
    for (var i = 0; i < order.length; i++) {
      var g = games[order[i]];
      if (!g) continue;
      var delKey = 'delgame:' + g.id;
      list += '<div class="gitem"><div style="min-width:0">' +
        '<div style="font-size:17px;font-weight:600">vs ' + esc(g.opp) + (g.sample ? ' <span class="tag">SAMPLE</span>' : '') + '</div>' +
        '<div class="muted num" style="font-size:13px">' + esc(niceDate(g.date)) + ' · ' + esc(g.venue) + ' · ' + g.poss.length + ' possessions · ' + gamePts(g) + ' pts conceded</div></div>' +
        '<div class="gbtns">' +
        '<button type="button" class="btn primary" data-a="open" data-v="' + g.id + '">Open</button>' +
        '<button type="button" class="btn" data-a="exportJSON" data-v="' + g.id + '">Backup</button>' +
        '<button type="button" class="btn ' + (S.confirm === delKey ? 'warn' : 'ghost') + '" data-a="delGame" data-v="' + g.id + '">' + (S.confirm === delKey ? 'Tap again' : 'Delete') + '</button>' +
        '</div></div>';
    }
    if (!list) list = '<div class="empty">No games yet. Start one on the left.</div>';

    app.innerHTML =
      '<header class="top" style="grid-template-columns:minmax(0,1fr) auto">' +
        '<div class="row"><div class="crest">89</div><div><div class="lbl" style="letter-spacing:.18em">Surrey 89ers · Defence</div>' +
        '<div style="font-size:18px;font-weight:600">How they scored</div></div></div>' + statusHTML() +
      '</header>' +
      '<div class="home-grid">' +
        '<section class="card stack" aria-label="New game">' +
          '<h1 class="h" style="font-size:24px">New game</h1>' +
          '<div class="field"><label class="lbl" for="ng-opp">Opponent</label><input id="ng-opp" type="text" autocomplete="off" data-ng="opp" value="' + esc(ng.opp) + '" placeholder="Team name"></div>' +
          '<div class="g2"><div class="field"><label class="lbl" for="ng-date">Date</label><input id="ng-date" type="date" data-ng="date" value="' + esc(ng.date) + '"></div>' +
          '<div class="field"><span class="lbl">Venue</span><div class="g2">' +
            '<button type="button" class="btn ' + (ng.venue === 'Home' ? 'on' : '') + '" data-a="ngVenue" data-v="Home">Home</button>' +
            '<button type="button" class="btn ' + (ng.venue === 'Away' ? 'on' : '') + '" data-a="ngVenue" data-v="Away">Away</button></div></div></div>' +
          '<div class="field"><label class="lbl" for="ng-roster">Their jersey numbers</label><input id="ng-roster" type="text" inputmode="numeric" autocomplete="off" data-ng="roster" value="' + esc(ng.roster) + '" placeholder="e.g. 0 3 5 7 11 14 21 23 32"></div>' +
          '<p class="hint" style="margin:0">Separate numbers with spaces. If you add the LiveStats link below you can leave this blank: numbers and names fill in from LiveStats.</p>' +
          '<div class="field"><label class="lbl" for="ng-ls">LiveStats link <span style="text-transform:none;letter-spacing:0;font-weight:500">(optional, for the Live tab)</span></label><input id="ng-ls" type="text" inputmode="url" autocomplete="off" data-ng="ls" value="' + esc(ng.ls) + '" placeholder="Paste the game\'s LiveStats link"></div>' +
          '<button type="button" class="btn big primary" data-a="startGame">Start logging</button>' +
        '</section>' +
        '<section class="card" aria-label="Saved games">' +
          '<div class="spread" style="margin-bottom:4px"><h2 class="h" style="font-size:24px">Games on this iPad</h2>' +
          '<label class="btn ghost" style="display:inline-flex;align-items:center" for="import-file">Restore backup</label>' +
          '<input id="import-file" type="file" accept=".json,application/json" style="position:absolute;left:-9999px"></div>' +
          list +
        '</section>' +
      '</div>';
  }

  function renderGame() {
    var g = G();
    var pts = gamePts(g);
    var tabsHTML = '<nav class="tabs" aria-label="Screens">' +
      tabBtn('quick', 'Game day') + tabBtn('log', 'Post game') + tabBtn('list', 'Possessions (' + g.poss.length + ')') + tabBtn('sum', 'Summary') + tabBtn('live', 'Live') + '</nav>';
    var qBtns = '';
    for (var i = 0; i < QUARTERS.length; i++) {
      qBtns += '<button type="button" class="' + (g.curQ === QUARTERS[i] ? 'on' : '') + '" data-a="setQ" data-v="' + QUARTERS[i] + '">' + QUARTERS[i] + '</button>';
    }
    var mark = g.marks && g.marks[g.curQ];
    var body = S.tab === 'list' ? listHTML(g) : S.tab === 'sum' ? sumHTML(g) : S.tab === 'live' ? liveHTML(g) : S.tab === 'log' ? logHTML(g) : quickHTML(g);

    app.innerHTML =
      '<header class="top">' +
        '<div class="row" style="min-width:0"><button type="button" class="btn ghost" data-a="home" aria-label="Back to games">' +
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px"><path d="M15 18l-6-6 6-6"></path></svg> Games</button>' +
          '<div style="min-width:0"><div class="lbl" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(niceDate(g.date)) + ' · ' + esc(g.venue) + '</div>' +
          '<div style="font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">vs ' + esc(g.opp) + '</div></div></div>' +
        (S.tab === 'live' ? '<div></div>' : '<div class="score"><div class="big num">' + pts + '</div><div class="lbl">pts conceded · ' + g.poss.length + ' poss</div></div>') +
        '<div style="display:flex;justify-content:flex-end">' + tabsHTML + '</div>' +
      '</header>' +
      (S.tab === 'live' ? '' : '<div class="qbar"><div class="seg" role="group" aria-label="Quarter">' + qBtns + '</div>' +
        '<button type="button" class="btn ghost" data-a="markQ" style="min-height:44px">' +
          (mark ? 'Start of ' + g.curQ + ' marked ' + hms(mark) : 'Mark start of ' + g.curQ) + '</button>' +
        '<span style="margin-left:auto">' + statusHTML() + '</span></div>') +
      (g.sample && S.tab !== 'live' ? '<div class="sample-banner">This is a sample game with example possessions. Try logging, then delete it from Games.</div>' : '') +
      body;
  }
  function tabBtn(id, label) {
    return '<button type="button" class="tab ' + (S.tab === id ? 'on' : '') + '" data-a="tab" data-v="' + id + '">' + esc(label) + '</button>';
  }

  function srcPts(g, id) { var t = 0; for (var i = 0; i < g.poss.length; i++) if (g.poss[i].src === id) t += g.poss[i].pts; return t; }

  function logHTML(g) {
    var f = S.f, sd = srcDef(f.src), i;

    var srcBtns = '';
    for (i = 0; i < SOURCES.length; i++) {
      var s = SOURCES[i], on = f.src === s.id, p = srcPts(g, s.id);
      srcBtns += '<button type="button" class="btn src ' + (on ? 'on' : '') + '" data-a="src" data-v="' + esc(s.id) + '" aria-pressed="' + on + '">' +
        '<span class="nm"><span class="dot" style="background:' + s.color + '"></span>' + esc(s.id) + '</span>' +
        '<span class="sub"><span class="num">' + (p ? p + ' pts' : '–') + '</span><span class="early">' + (s.early ? 'EARLY' : '') + '</span></span></button>';
    }

    var col2;
    if (!sd) {
      col2 = '<div class="empty">Pick what started the possession first</div>';
    } else {
      var fin = '';
      for (i = 0; i < sd.finishes.length; i++) fin += opt('fin', sd.finishes[i], sd.finishes[i]);
      if (f.fin && sd.finishes.indexOf(f.fin) < 0) fin += opt('fin', f.fin, f.fin + ' (old)');
      var wh = '';
      for (i = 0; i < WHERE.length; i++) wh += opt('where', WHERE[i], WHERE[i]);
      col2 = '<div class="g2">' + fin + '</div>' +
        '<div class="stack" style="grid-gap:6px;gap:6px"><div class="lbl">Where <span style="text-transform:none;letter-spacing:0;font-weight:500">(optional)</span></div><div class="g5">' + wh + '</div></div>';
      if (sd.cov) {
        var cv = '';
        for (i = 0; i < COVS.length; i++) cv += opt('cov', COVS[i], COVS[i]);
        col2 += '<div class="stack" style="grid-gap:6px;gap:6px"><div class="lbl">Our coverage</div><div class="g3">' + cv + '</div></div>';
      }
    }

    var res = '';
    for (i = 0; i < RESULTS.length; i++) {
      var r = RESULTS[i];
      res += '<button type="button" class="btn ' + r.span + ' ' + (f.res === r.id ? 'on' : '') + '" data-a="res" data-v="' + r.id + '">' + r.label + '</button>';
    }
    var ftRow = '';
    if (f.res === 'FTs') {
      var fb = '';
      for (i = 0; i <= 3; i++) fb += '<button type="button" class="btn ' + (f.ft === i ? 'on' : '') + '" data-a="ft" data-v="' + i + '">' + i + '</button>';
      ftRow = '<div class="row"><span class="lbl" style="width:90px">FTs made</span><div class="g6" style="flex-grow:1;grid-template-columns:repeat(4,minmax(0,1fr))">' + fb + '</div></div>';
    }

    var roles = [['creator', 'Creator']];
    if (sd && sd.screen) roles.push(['screener', 'Screener']);
    roles.push(['scorer', 'Shooter']);
    if (!sd || !sd.screen) { if (S.role === 'screener') S.role = 'scorer'; }
    var roleBtns = '';
    for (i = 0; i < roles.length; i++) {
      var rk = roles[i][0], val = f[rk];

    for (i = 0; i < roster.length; i++) {

        '<div class="g2"><button type="button" class="btn" data-a="rosterCancel">Cancel</button><button type="button" class="btn primary" data-a="rosterSave">Save roster</button></div>'
      : '<div class="g6">' + jBtns + '</div>';

    var canLog = !!(f.src && f.res && (f.res !== 'FTs' || f.ft !== null));

          '<div class="g2">' + srcBtns + '</div>' +

        '</section>' +

  function startBanner(g) {
    var ord = sortedPoss(g); if (!ord.length) return '';

    for (var i = 0; i < ord.length; i++) if (ord[i].quick) { firstTodo = ord[i]; break; }

  }
  function sortedPoss(g) { return g.poss.slice().sort(function (a, b) { return a.t - b.t || a.n - b.n; }); }
  function neighbour(g, id, step) {
    var ord = sortedPoss(g);
    for (var i = 0; i < ord.length; i++) if (ord[i].id === id) return ord[i + step] || null;
    return null;
  }
  function openEdit(g, id) {
    var p = possById(g, id); if (!p) return;
    S.f = { src: p.src, fin: p.fin, where: p.where, cov: p.cov, res: p.res, ft: p.ft, creator: p.creator, screener: p.screener, scorer: p.scorer, echoes: (p.echoes || []).slice() };
    S.editId = p.id; S.tab = 'log'; S.role = 'creator'; S.confirm = null;

  }
  function possById(g, id) { for (var i = 0; i < g.poss.length; i++) if (g.poss[i].id === id) return g.poss[i]; return null; }
  function needDetail(g) { var n = 0; for (var i = 0; i < g.poss.length; i++) if (g.poss[i].quick) n++; return n; }

  /* Game day: just what happened. Source, optional finish, then one tap on the result logs it. */
  function quickHTML(g) {
    var q = S.q, sd = srcDef(q.src), i;
    var srcBtns = '';

      var s = SOURCES[i], on = q.src === s.id, p = srcPts(g, s.id);

    var todo = needDetail(g);

    return lvCallStripHTML(g) + '<div class="gd-grid">' +

        '</section>' +
      '</div>' + recentHTML(g);

  function quickLog(g, v) {
    var q = S.q, sd = srcDef(q.src);
    if (!sd) { toast('Pick the source first'); return; }
    var res = v, ft = null;
    if (v.indexOf('FTs:') === 0) { res = 'FTs'; ft = Number(v.slice(4)); }
    var maxN = 0;
    for (var j = 0; j < g.poss.length; j++) maxN = Math.max(maxN, g.poss[j].n);
    var rec = { id: uid(), n: maxN + 1, q: g.curQ, t: Date.now(), src: q.src, fin: q.fin, where: null, cov: sd.cov ? q.cov : null, res: res, ft: ft,
      pts: ptsFor(res, ft), creator: null, screener: null, scorer: null, echoes: [], early: !!sd.early, quick: true };
    g.poss.push(rec);
    saveGame(g);
    S.q = { src: null, fin: null, cov: null };
    toast('Logged #' + rec.n + ': ' + rec.src + (rec.fin ? ' › ' + rec.fin : '') + (rec.cov ? ' · ' + rec.cov : '') + ' · ' + resText(rec));
  }
  function opt(key, val, label) {
    var on = S.f[key] === val;
    return '<button type="button" class="btn ' + (on ? 'on' : '') + '" data-a="opt" data-k="' + key + '" data-v="' + esc(val) + '" aria-pressed="' + on + '">' + esc(label) + '</button>';
  }
  function whoText(p) {
    var parts = [];
    if (p.creator) parts.push('#' + p.creator);

  }

  function listHTML(g) {
    var todo = needDetail(g);
    if (!todo) S.listFilter = 'all';
    var onlyTodo = S.listFilter === 'quick';
    var rows = '', ps = g.poss.slice().sort(function (a, b) { return onlyTodo ? a.t - b.t : b.t - a.t; });

        '<td><span class="dot" style="background:' + (srcDef(p.src) || { color: OTHER }).color + ';margin-right:8px"></span>' + esc(p.src) + (p.fin ? ' › ' + esc(p.fin) : '') + (p.early ? ' <span class="tag">EARLY</span>' : '') + (p.quick ? ' <span class="tag todo">GAME DAY</span>' : '') + '</td>' +
        '<td class="muted">' + esc([p.where, p.cov].filter(Boolean).join(' · ')) + '</td>' +

        '<td class="r" style="white-space:nowrap"><button type="button" class="btn' + (p.quick ? ' primary' : '') + '" data-a="edit" data-v="' + p.id + '" style="min-height:40px">' + (p.quick ? 'Add detail' : 'Edit') + '</button> ' +
        '<button type="button" class="btn ' + (S.confirm === dk ? 'warn' : 'ghost') + '" data-a="del" data-v="' + p.id + '" style="min-height:40px">' + (S.confirm === dk ? 'Tap again' : 'Delete') + '</button></td></tr>';
    }

      '<div class="spread" style="flex-wrap:wrap"><div class="row"><h2 class="h" style="font-size:21px;margin-right:6px">' + (onlyTodo ? 'Needs detail' : 'All possessions') + '</h2>' + filt + '</div>' +
        '<div class="gbtns"><button type="button" class="btn" data-a="exportCSV">Export CSV</button><button type="button" class="btn" data-a="exportJSON" data-v="' + g.id + '">Backup file</button><button type="button" class="btn" data-a="copyCSV">Copy CSV</button></div></div>' +
      '<div class="scroll-x"><table class="tbl"><thead><tr><th>#</th><th>Q</th><th>Logged</th><th>Source › finish</th><th>Where · cov</th><th>Players</th><th>Result</th><th class="r"></th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '</section>';

  function sumHTML(g) {

    var bar = '<div class="qbar" style="padding-top:0"><div class="seg seg-mode" role="group" aria-label="Summary scope">' + mb + '</div>' +

    return bar + (S.sumMode === 'season' ? seasonHTML(g) : sumGameHTML(g));
  }

  function sumGameHTML(g) {
    var ps = [], i, k;
    for (i = 0; i < g.poss.length; i++) if (S.sumQ === 'All' || g.poss[i].q === S.sumQ) ps.push(g.poss[i]);

    var tot = 0, early = 0, tos = 0, bySrc = {}, cov = {}, pl = {};
    function add(o, key, pts) { (o[key] = o[key] || { pts: 0, poss: 0 }); o[key].pts += pts; o[key].poss++; }
    for (i = 0; i < ps.length; i++) {
      var p = ps[i];
      tot += p.pts; if (p.early) early += p.pts; if (p.res === 'TO') tos++;
      add(bySrc, p.src, p.pts);
      var bs = bySrc[p.src]; bs.fin = bs.fin || {}; add(bs.fin, p.fin || '', p.pts);
      if (p.cov) add(cov, p.src + ' · ' + p.cov, p.pts);
      var inv = [];
      if (p.creator && p.creator !== '?') inv.push(p.creator);
      if (p.scorer && p.scorer !== '?' && inv.indexOf(p.scorer) < 0) inv.push(p.scorer);
      for (k = 0; k < inv.length; k++) {

    }
    var n = ps.length;
    function ppp(a, b) { return b ? (a / b).toFixed(2) : '–'; }
    function byPts(o) { return function (a, b) { return o[b].pts - o[a].pts || o[b].poss - o[a].poss; }; }

    var srcRows = '', keys = Object.keys(bySrc).sort(byPts(bySrc));
    var maxPts = 1; for (i = 0; i < keys.length; i++) maxPts = Math.max(maxPts, bySrc[keys[i]].pts);
    var allOpen = keys.length > 0;
    for (i = 0; i < keys.length; i++) {
      var key = keys[i], b = bySrc[key], col = (srcDef(key) || { color: OTHER }).color, open = !!S.sumOpen[key];

      srcRows += '<tr class="sx-row' + (open ? ' open' : '') + '"><td style="white-space:nowrap"><button type="button" class="sx" data-a="sumSrc" data-v="' + esc(key) + '" aria-expanded="' + open + '">' +

        '<td style="width:40%"><div class="bar"><span style="width:' + Math.round(b.pts / maxPts * 100) + '%;background:' + col + '"></span></div></td>' +
        '<td class="r num" style="font-weight:600">' + b.pts + '</td><td class="r num muted">' + b.poss + '</td><td class="r num" style="font-weight:600">' + ppp(b.pts, b.poss) + '</td></tr>';
      if (open) {
        var fk = Object.keys(b.fin).sort(byPts(b.fin)), fmax = 1;
        for (k = 0; k < fk.length; k++) fmax = Math.max(fmax, b.fin[fk[k]].pts);
        for (k = 0; k < fk.length; k++) {
          var fb = b.fin[fk[k]];
          srcRows += '<tr class="sx-sub"><td><span class="fin-nm' + (fk[k] ? '' : ' muted') + '">' + esc(fk[k] || 'No finish logged') + '</span>' +
              '<span class="muted num" style="font-size:12px;margin-left:6px">' + (b.pts ? Math.round(fb.pts / b.pts * 100) + '%' : '') + '</span></td>' +
            '<td><div class="bar thin"><span style="width:' + Math.round(fb.pts / fmax * 100) + '%;background:' + col + ';opacity:.65"></span></div></td>' +
            '<td class="r num">' + fb.pts + '</td><td class="r num muted">' + fb.poss + '</td><td class="r num">' + ppp(fb.pts, fb.poss) + '</td></tr>';
        }
      }
    }
    if (!srcRows) srcRows = '<tr><td colspan="5" class="muted">Nothing logged for this period.</td></tr>';

    var covRows = '', ckeys = Object.keys(cov).sort(function (a, b) { return cov[b].poss - cov[a].poss; });
    for (i = 0; i < ckeys.length; i++) covRows += '<tr><td>' + esc(ckeys[i]) + '</td><td class="r num">' + cov[ckeys[i]].pts + '</td><td class="r num muted">' + cov[ckeys[i]].poss + '</td><td class="r num" style="font-weight:600">' + ppp(cov[ckeys[i]].pts, cov[ckeys[i]].poss) + '</td></tr>';
    if (!covRows) covRows = '<tr><td colspan="4" class="muted">No coverages logged yet.</td></tr>';

    var plRows = '', pkeys = Object.keys(pl).sort(function (a, b) { return pl[b].involved - pl[a].involved; });
    for (i = 0; i < pkeys.length && i < 10; i++) {
      var pp = pl[pkeys[i]], nm = pName(g, pkeys[i]);
      plRows += '<tr><td style="white-space:nowrap"><span style="font-family:var(--display);font-weight:700;font-size:18px">#' + esc(pkeys[i]) + '</span>' +
          (nm ? '<span style="margin-left:8px;font-weight:600">' + esc(nm) + '</span>' : '') + '</td>' +
        '<td class="r num" style="font-weight:600">' + pp.involved + '</td><td class="r num muted">' + pp.created + '</td><td class="r num muted">' + pp.scored + '</td></tr>';
    }
    if (!plRows) plRows = '<tr><td colspan="4" class="muted">No players logged yet.</td></tr>';

    return '<div class="kpis">' +
        kpi(tot, 'points conceded', n + ' possessions logged') +
        kpi(ppp(tot, n), 'points per possession', 'all sources') +
        kpi(tot ? Math.round(early / tot * 100) + '%' : '–', 'before our D was set', early + ' of ' + tot + ' pts (transition + off. rebounds)') +
        kpi(tos, 'turnovers forced', 'logged as Turnover') +
      '</div>' +
      '<div class="sum-grid">' +

  /* live refresh without rebuilding the page, so typing in the call box isn't interrupted */
  function lvRefresh() {
    var g = G();
    if (S.view !== 'game' || !g) return;
    var stamp0 = document.getElementById('lv-stamp');
    if (stamp0) { var n0 = lvNow(g); stamp0.textContent = lvPerLabel(n0.per) + ' ' + lvClock(n0.rem); }
    if (S.tab !== 'live') return;
    var bar = document.getElementById('lv-bar'), stats = document.getElementById('lv-stats'), stamp = document.getElementById('lv-stamp');
    if (bar) bar.innerHTML = lvBarHTML(g);
    var ae = document.activeElement;
    if (stats && !(ae && ae.getAttribute && ae.getAttribute('data-lvt'))) stats.innerHTML = lvStatsHTML(g);
    if (stamp) { var n = lvNow(g); stamp.textContent = lvPerLabel(n.per) + ' ' + lvClock(n.rem); }
  }
  function lvFail(err) { LV.ok = false; LV.fails++; LV.err = err; }
  function lvPoll() {
    clearTimeout(LV.timer); LV.timer = null;
    var gid = LV.gameId, id = LV.lsId;
    if (!gid || !id) return;
    var x = new XMLHttpRequest();
    x.open('GET', 'api/game?id=' + encodeURIComponent(id) + '&_=' + Date.now(), true);
    x.timeout = 8000;
    function done() {
      if (LV.gameId !== gid || LV.lsId !== id) return;
      lvRefresh();
      LV.timer = setTimeout(lvPoll, LV.d && LV.d.ended ? LV_POLL_SLOW : LV_POLL);
    }
    x.onload = function () {
      if (LV.gameId !== gid || LV.lsId !== id) return;
      var j = null;
      try { j = JSON.parse(x.responseText); } catch (e) {}
      if (x.status === 200 && j && j.t1) { lvApply(j); LV.ok = true; LV.at = Date.now(); LV.err = ''; LV.fails = 0; lvRosterSync(gid); }
      else lvFail(j && j.error ? j.error : (j ? 'Feed answered ' + x.status : 'nohost'));
      done();
    };
    x.onerror = function () { if (LV.gameId === gid && LV.lsId === id) { lvFail('offline'); done(); } };
    x.ontimeout = function () { if (LV.gameId === gid && LV.lsId === id) { lvFail('Feed timed out'); done(); } };
    try { x.send(); } catch (e) { lvFail('offline'); done(); }
  }
  /* start or stop the feed to match the open game */
  function lvSync() {
    var g = G(), on = S.view === 'game' && g && g.ls;
    var want = on ? g.id + '|' + g.ls : '', have = LV.gameId ? LV.gameId + '|' + LV.lsId : '';
    if (want === have) return;
    clearTimeout(LV.timer); LV.timer = null;
    if (!on || LV.gameId !== g.id) LV.draft = null;
    LV.gameId = on ? g.id : null; LV.lsId = on ? g.ls : null;
    LV.d = null; LV.ok = false; LV.at = 0; LV.err = ''; LV.fails = 0;
    if (on) lvPoll();
  }
  setInterval(function () {
    if (S.view === 'game' && S.tab === 'live' && LV.gameId) { var bar = document.getElementById('lv-bar'); var g = G(); if (bar && g) bar.innerHTML = lvBarHTML(g); }
  }, 1000);

  /* keep a typed clock when the quarter or a saved playcall is tapped */
  function lvKeepClock() {
    var ci = document.getElementById('lv-clock'), r = ci ? lvParseClock(ci.value) : null;
    if (r !== null && LV.draft) LV.draft.rem = r;
  }
  function lvSaveDraft(g) {
    var dr = LV.draft;
    if (!dr) return false;
    var ci = document.getElementById('lv-clock');
    if (ci) {
      var r = lvParseClock(ci.value);
      if (r === null) { toast('Type the clock like 531 or 5:31'); ci.focus(); return false; }
      dr.rem = r;
    }
    if (dr.rem > lvPerLen(LV.d, dr.per)) { toast('That clock is longer than a ' + (dr.per > 4 ? 'overtime' : 'quarter')); return false; }
    g.calls = g.calls || [];
    var call = String(dr.call || '').replace(/^\s+|\s+$/g, '') || 'Unknown';
    var rec = { id: dr.id || uid(), per: dr.per, rem: dr.rem, call: call, note: String(dr.note || '').replace(/^\s+|\s+$/g, ''), opp: lvOppKey(g), at: dr.at || new Date().toISOString() };
    var found = false;
    for (var i = 0; i < g.calls.length; i++) if (g.calls[i].id === rec.id) { g.calls[i] = rec; found = true; }
    if (!found) g.calls.push(rec);
    if (call !== 'Unknown') lvAddToBook(g, call);
    saveGame(g);
    LV.draft = null;
    toast('Logged ' + lvPerLabel(rec.per) + ' ' + lvClock(rec.rem) + ': ' + call);
    return true;
  }
  function lvCsv(g) {
    var lines = ['opponent,date,livestats_game,quarter,clock,playcall,note,logged_at'];
    var cs = lvSortedCalls(g, true);
    for (var i = 0; i < cs.length; i++) {

  function lvText(g) {

  function lvAct(a, v, g) {
    var dr = LV.draft;
    switch (a) {
      case 'lvConnect':

        return true;
      case 'lvPer': if (dr) { lvKeepClock(); dr.per = Number(v); dr.rem = Math.min(dr.rem, lvPerLen(LV.d, dr.per)); } return true;
      case 'lvBook': if (dr) { lvKeepClock(); dr.call = v; } return true;
      case 'lvCancel': LV.draft = null; return true;
      case 'lvSave': return lvSaveDraft(g);
      case 'lvEdit':
        if (dr && dr.id === v) { LV.draft = null; return true; }
        var cs = g.calls || [];
        for (var i = 0; i < cs.length; i++) if (cs[i].id === v) {
          LV.draft = { id: cs[i].id, per: cs[i].per, rem: cs[i].rem, call: cs[i].call === 'Unknown' ? '' : cs[i].call, note: cs[i].note || '', at: cs[i].at };
        }
        return true;
      case 'lvDel':

          g.calls = (g.calls || []).filter(function (c) { return c.id !== v; });
          saveGame(g); S.confirm = null; if (LV.draft && LV.draft.id === v) LV.draft = null; toast('Call deleted');
        } else armConfirm('lvdel:' + v);
        return true;
      case 'lvCopy':

        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(lvText(g)).then(function () { toast('Calls copied'); }, function () { toast('Copy was blocked here'); });
        else toast('Copy isn\'t available here');
        return false;
      case 'lvCSV':
        if (!(g.calls || []).length) { toast('No calls logged yet'); return false; }
        saveFile(fileName(g, 'calls.csv'), 'text/csv', lvCsv(g));

    return false;
  }

  /* ---------- Actions ---------- */
  function act(a, v, el) {
    var g = G(), f = S.f;

    switch (a) {

      case 'listFilter': S.listFilter = v; S.confirm = null; break;
      case 'setQ': g.curQ = v; saveGame(g); break;
      case 'markQ': g.marks = g.marks || {}; g.marks[g.curQ] = Date.now(); saveGame(g); toast('Start of ' + g.curQ + ' marked'); break;
      case 'src':
        if (f.src !== v) { f.src = v; f.fin = null; f.cov = null; f.where = null; if (!srcDef(v).screen) f.screener = null; }
        break;
      case 'opt': var key = el.getAttribute('data-k'); f[key] = f[key] === v ? null : v; break;
      case 'res': f.res = f.res === v ? null : v; if (f.res !== 'FTs') f.ft = null; break;
      case 'ft': f.ft = Number(v); break;
      case 'role': S.role = v; break;
      case 'num':

  function logPossession(g) {
    var f = S.f, sd = srcDef(f.src);
    if (!(f.src && f.res && (f.res !== 'FTs' || f.ft !== null))) return;
    var rec = { src: f.src, fin: f.fin, where: f.where, cov: sd.cov ? f.cov : null, res: f.res, ft: f.res === 'FTs' ? f.ft : null,
      pts: ptsFor(f.res, f.ft), creator: f.creator, screener: sd.screen ? f.screener : null, scorer: f.scorer,
      echoes: f.echoes.slice().sort(), early: !!sd.early };
    if (S.editId) {
      for (var i = 0; i < g.poss.length; i++) if (g.poss[i].id === S.editId) {
        var old = g.poss[i];
        rec.id = old.id; rec.n = old.n; rec.q = old.q; rec.t = old.t;
        g.poss[i] = rec;
      }
      var nx = neighbour(g, rec.id, 1);
      saveGame(g);
      if (nx) { openEdit(g, nx.id); toast('#' + rec.n + ' saved · now on #' + nx.n); return; }
      S.editId = null; S.tab = 'list';
      toast('#' + rec.n + ' saved · that was the last possession');
    } else {
      var maxN = 0;
      for (var j = 0; j < g.poss.length; j++) maxN = Math.max(maxN, g.poss[j].n);
      rec.id = uid(); rec.n = maxN + 1; rec.q = g.curQ; rec.t = Date.now();
      g.poss.push(rec);

  app.addEventListener('focusin', function (e) {
    var t = e.target;
    if (t.getAttribute && t.getAttribute('data-lvclock')) setTimeout(function () { try { t.setSelectionRange(0, t.value.length); } catch (x) {} }, 0);
  });
  app.addEventListener('keydown', function (e) {
    var t = e.target;
    if (e.key !== 'Enter' || !t.getAttribute) return;
    if (t.getAttribute('data-lvd') || t.getAttribute('data-lvclock')) { e.preventDefault(); act('lvSave', null, t); }
    else if (t.getAttribute('data-lvlink')) { e.preventDefault(); act('lvConnect', null, t); }
  });
  app.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'import-file' && t.files && t.files[0]) importFile(t.files[0]);
    if (t.getAttribute('data-lvt')) {
      var tg = lvTargets(), nv = Math.round(Number(t.value));
      if (nv > 0) { tg[t.getAttribute('data-lvt')] = nv; sset('targets', tg); }
    }
  });

  /* ---------- Start ---------- */
  loadAll();
  if (!order.length && !sget('sampleDismissed')) { saveGame(makeSample()); }
  render();
})();
</script>

<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
